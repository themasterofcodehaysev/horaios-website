[program:horaios-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/horaios-website/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/horaios-website/storage/logs/queue-worker.log
stopwaitsecs=3600

[program:horaios-queue-scheduler]
process_name=%(program_name)s
command=php /var/www/horaios-website/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/horaios-website/storage/logs/scheduler.log

# Supervisor Configuration for Horaios Baptist Church
# 
# DEPLOYMENT INSTRUCTIONS:
# 
# 1. Copy this file to /etc/supervisor/conf.d/horaios.conf
# 2. Update the paths to match your actual deployment directory
# 3. Update the user to match your web server user (usually www-data or nginx)
# 4. Update Redis connection if using a different queue driver
# 
# COMMANDS:
# 
# sudo supervisorctl reread
# sudo supervisorctl update
# sudo supervisorctl start horaios-queue-worker:*
# sudo supervisorctl start horaios-queue-scheduler
# 
# MONITORING:
# 
# sudo supervisorctl status
# sudo supervisorctl tail horaios-queue-worker:horaios-queue-worker_00
# 
# RESTARTING:
# 
# sudo supervisorctl restart horaios-queue-worker:*
# sudo supervisorctl restart horaios-queue-scheduler
